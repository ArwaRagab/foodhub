<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصفح المطاعم — وجبة</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>وجبة</a>
      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html" class="active">المطاعم</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="nav-cart" aria-label="السلة"><i class="fa-solid fa-cart-shopping"></i><span
            class="badge-dot">0</span></a>
        <a href="profile.html" class="avatar">أم</a>
        <button class="nav-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main class="container section-tight">

    <div class="card card-pad mb-3" style="display:flex; gap:14px; flex-wrap:wrap;">
      <div class="input-icon-wrap" style="flex:2; min-width:220px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input class="input" id="searchInput" type="text" placeholder="دور على أصناف أكل...">
      </div>
      <select class="input" id="sortSelect" style="flex:0 0 200px;">
        <option value="recommended">الترتيب: المقترح</option>
        <option value="rating">الترتيب: الأعلى تقييمًا</option>
        <option value="time">الترتيب: الأسرع توصيلًا</option>
        <option value="fee">الترتيب: الأقل رسوم توصيل</option>
      </select>
    </div>

    <div class="section-head">
      <div>
        <h2 id="resultsTitle">كل المطاعم</h2>
        <p id="resultsCount" class="text-muted"></p>
      </div>
    </div>
    <div class="grid grid-4" id="restaurantGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-regular fa-face-frown"></i>
      <h3>مفيش مطاعم مطابقة لبحثك</h3>
      <p class="text-muted">جرّب كلمة بحث مختلفة أو شيل الفلاتر.</p>
    </div>

    <section class="section-tight">
      <div class="section-head">
        <div>
          <h2>مقترح لك</h2>
          <p class="text-muted">على حسب طلباتك الأخيرة وتفضيلاتك في الأكل.</p>
        </div>
      </div>
      <div class="grid grid-4" id="recommendedGrid"></div>
    </section>

  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let activeQuery = '';

    function applyFilters() {
      let list = [...FH_DATA.restaurants];

      if (activeQuery) {
        const q = activeQuery.toLowerCase();
        list = list.filter(r => r.name.toLowerCase().includes(q) || r.cuisine.toLowerCase().includes(q));
      }

      const sortBy = FH.qs('#sortSelect').value;
      if (sortBy === 'rating') list.sort((a, b) => b.rating - a.rating);
      if (sortBy === 'time') list.sort((a, b) => parseInt(a.deliveryTime) - parseInt(b.deliveryTime));
      if (sortBy === 'fee') list.sort((a, b) => a.deliveryFee - b.deliveryFee);

      const grid = FH.qs('#restaurantGrid');
      const empty = FH.qs('#emptyState');
      grid.innerHTML = list.map(r => FH.restaurantCardHTML(r)).join('');
      grid.style.display = list.length ? 'grid' : 'none';
      empty.style.display = list.length ? 'none' : 'block';
      FH.qs('#resultsCount').textContent = `${list.length} مطعم متاح`;
    }

    FH.qs('#searchInput').addEventListener('input', (e) => { activeQuery = e.target.value; applyFilters(); });
    FH.qs('#sortSelect').addEventListener('change', applyFilters);

    // تحديد البحث مسبقًا عن طريق الرابط
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) { activeQuery = params.get('q'); FH.qs('#searchInput').value = activeQuery; }

    applyFilters();

    // مقترح (آخر 4 كمحاكاة بسيطة)
    FH.qs('#recommendedGrid').innerHTML = FH_DATA.restaurants.slice(-4).map(r => FH.restaurantCardHTML(r)).join('');
  </script>
</body>

</html>
