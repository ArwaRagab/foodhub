<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة المشتريات — وجبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>وجبة</a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="dashboard.html">المطاعم</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="nav-cart active" aria-label="السلة"><i class="fa-solid fa-cart-shopping"></i><span class="badge-dot">0</span></a>
      <a href="profile.html" class="avatar">أم</a>
      <button class="nav-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<main class="container section-tight">
  <h2 class="mb-1"><i class="fa-solid fa-cart-shopping" style="color:var(--c-primary);"></i> سلة المشتريات</h2>
  <p class="mb-3 text-muted">راجع طلبك قبل ما تكمل الدفع.</p>

  <div class="cart-layout">
    <div class="card card-pad" id="cartItemsCard">
      <div id="cartLines"></div>
      <div class="empty-state" id="cartEmpty" style="display:none;">
        <i class="fa-solid fa-cart-shopping"></i>
        <h3>السلة فاضية</h3>
        <p class="text-muted mb-3">تصفح المطاعم وضيف حاجة لذيذة.</p>
        <a href="dashboard.html" class="btn btn-primary">تصفح المطاعم</a>
      </div>
    </div>

    <div class="card card-pad" id="summaryCard">
      <h3 class="mb-2">ملخص الطلب</h3>
      <div class="summary-row"><span>الإجمالي الفرعي</span><span class="price" id="sumSubtotal">0.00 ج.م</span></div>
      <div class="summary-row"><span>رسوم التوصيل</span><span class="price" id="sumDelivery">0.00 ج.م</span></div>
      <div class="summary-row total"><span>الإجمالي</span><span class="price" id="sumTotal">0.00 ج.م</span></div>

      <a href="checkout.html" class="btn btn-primary btn-block btn-lg mt-3" id="checkoutBtn">إتمام الطلب <i class="fa-solid fa-arrow-left"></i></a>
      <a href="dashboard.html" class="btn btn-ghost btn-block mt-1">ضيف عناصر تانية</a>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>

function renderCart(){
  const cart = FH.getCart();
  const linesEl = FH.qs('#cartLines');
  const emptyEl = FH.qs('#cartEmpty');
  const summaryCard = FH.qs('#summaryCard');

  if(cart.length === 0){
    linesEl.style.display = 'none'; emptyEl.style.display = 'block'; summaryCard.style.display='none';
    return;
  }
  linesEl.style.display = 'block'; emptyEl.style.display = 'none'; summaryCard.style.display='block';

  linesEl.innerHTML = cart.map(item => `
    <div class="cart-line">
      <img src="${item.img}" alt="${item.name}">
      <div class="cart-line-info">
        <h4>${item.name}</h4>
        <div class="sub">${item.restaurant || ''}</div>
      </div>
      <span class="price">${FH.fmt(item.price * item.qty)}</span>
      <div class="qty-stepper">
        <button onclick="changeQty('${item.id}', ${item.qty - 1})">−</button>
        <span>${item.qty}</span>
        <button onclick="changeQty('${item.id}', ${item.qty + 1})">+</button>
      </div>
      <button class="icon-btn danger" aria-label="حذف" onclick="FH.removeFromCart('${item.id}'); renderCart();"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');

  const subtotal = FH.cartSubtotal();
  const deliveryFee = subtotal > 0 ? 12.5 : 0;
  const total = Math.max(subtotal + deliveryFee, 0);
  FH.qs('#sumSubtotal').textContent = FH.fmt(subtotal);
  FH.qs('#sumDelivery').textContent = FH.fmt(deliveryFee);
  FH.qs('#sumTotal').textContent = FH.fmt(total);

  localStorage.setItem('fh_order_total', total.toFixed(2));
}

function changeQty(id, qty){ FH.updateCartQty(id, qty); renderCart(); }

renderCart();
</script>
</body>
</html>
