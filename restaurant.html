<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة المطعم — وجبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>وجبة</a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="dashboard.html" class="active">المطاعم</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="nav-cart" aria-label="السلة"><i class="fa-solid fa-cart-shopping"></i><span class="badge-dot">0</span></a>
      <a href="profile.html" class="avatar">أم</a>
      <button class="nav-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="r-hero"><img id="heroImg" src="" alt="غلاف المطعم"></div>

<main class="container" style="padding-bottom:60px;">

  <div class="r-info-card">
    <img class="r-logo" id="logoImg" src="" alt="شعار المطعم">
    <div class="r-info-meta">
      <div class="flex items-center gap-2" style="flex-wrap:wrap;">
        <h2 id="rName">—</h2>
      </div>
      <p id="rCuisine" class="text-muted mt-1">—</p>
      <div class="r-card-meta mt-1">
        <span><i class="fa-regular fa-clock"></i> <span id="rTime"></span></span>
        <span><i class="fa-solid fa-motorcycle"></i> <span id="rFee"></span> توصيل</span>
      </div>
    </div>
  </div>

  <div class="tabs mt-4" id="menuTabs"></div>

  <div id="menuList" class="mt-2"></div>

</main>

<!-- شريط السلة الثابت -->
<div id="cartBar" style="display:none; position:fixed; bottom:0; right:0; left:0; background:var(--c-dark); color:white; padding:16px 24px; z-index:90; box-shadow:0 -8px 24px rgba(0,0,0,0.18);">
  <div class="container flex justify-between items-center">
    <span><strong id="cartBarCount">0</strong> عنصر · <span class="price" id="cartBarTotal">0.00 ج.م</span></span>
    <a href="cart.html" class="btn btn-primary">عرض السلة <i class="fa-solid fa-arrow-left"></i></a>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const rid = params.get('id') || 'r1';
const r = FH_DATA.getRestaurant(rid) || FH_DATA.restaurants[0];

FH.qs('#heroImg').src = r.image; FH.qs('#heroImg').alt = r.name;
FH.qs('#logoImg').src = r.logo;
FH.qs('#rName').textContent = r.name;
FH.qs('#rCuisine').textContent = r.cuisine;
FH.qs('#rTime').textContent = r.deliveryTime;
FH.qs('#rFee').textContent = r.deliveryFee === 0 ? 'مجاني' : FH.fmt(r.deliveryFee);

const menu = FH_DATA.getMenu(r.id);
let activeTab = menu.tabs[0];

FH.qs('#menuTabs').innerHTML = menu.tabs.map(t => `<button class="tab-btn ${t===activeTab?'active':''}" data-tab="${t}">${t}</button>`).join('');

function renderMenu(){
  const items = menu.items.filter(i => i.tab === activeTab);
  FH.qs('#menuList').innerHTML = items.map(item => `
    <div class="menu-item-row">
      <img class="menu-item-img" src="${item.img}" alt="${item.name}">
      <div class="menu-item-info">
        <h4>${item.name}</h4>
        <p>${item.desc}</p>
        <div class="menu-item-foot">
          <span class="price">${FH.fmt(item.price)}</span>
          <button class="btn btn-primary btn-sm" onclick='FH.addToCart({id:"${item.id}",name:${JSON.stringify(item.name)},price:${item.price},img:${JSON.stringify(item.img)},restaurant:${JSON.stringify(r.name)}}); updateCartBar();'>
            <i class="fa-solid fa-plus"></i> إضافة
          </button>
        </div>
      </div>
    </div>`).join('');
}
renderMenu();

FH.qsa('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  FH.qsa('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderMenu();
}));

function updateCartBar(){
  const count = FH.cartCount();
  const bar = FH.qs('#cartBar');
  bar.style.display = count > 0 ? 'block' : 'none';
  FH.qs('#cartBarCount').textContent = count;
  FH.qs('#cartBarTotal').textContent = FH.fmt(FH.cartSubtotal());
}
updateCartBar();
</script>
</body>
</html>
