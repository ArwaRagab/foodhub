<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الطلب — وجبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>وجبة</a>
    <nav class="nav-links"><a href="dashboard.html">المطاعم</a><a href="profile.html">طلباتي</a></nav>
    <div class="nav-actions">
      <a href="cart.html" class="nav-cart"><i class="fa-solid fa-cart-shopping"></i><span class="badge-dot">0</span></a>
      <a href="profile.html" class="avatar">أم</a>
    </div>
  </div>
</header>

<main class="container section-tight">

  <div class="steps-row">
    <div class="step-pill done"><span class="num"><i class="fa-solid fa-check"></i></span> السلة</div>
    <div class="step-line"></div>
    <div class="step-pill done"><span class="num"><i class="fa-solid fa-check"></i></span> إتمام الطلب</div>
    <div class="step-line"></div>
    <div class="step-pill active"><span class="num">3</span> تتبع الطلب</div>
  </div>

  <div class="card card-pad mb-3 flex justify-between items-center" style="flex-wrap:wrap; gap:14px;">
    <div>
      <h2>طلب <span class="price">#WJ-10523</span></h2>
      <p class="text-muted mt-1">بيلا نابولي للبيتزا · 3 عناصر · <span class="price">122.50 ج.م</span></p>
    </div>
    <span class="badge badge-warning" id="statusBadge"><i class="fa-solid fa-fire-burner"></i> قيد التحضير</span>
  </div>

  <div class="card card-pad" style="max-width:560px; margin:0 auto;">
    <h3 class="mb-2">تفاصيل الطلب</h3>
    <div class="flex justify-between text-sm mt-1"><span>1× مارجريتا كلاسيك</span><span class="price">47.50 ج.م</span></div>
    <div class="flex justify-between text-sm mt-1"><span>1× ديافولا الحارة</span><span class="price">57.50 ج.م</span></div>
    <div class="flex justify-between text-sm mt-1"><span>1× سان بيليجرينو</span><span class="price">10.00 ج.م</span></div>
    <div class="ticket-divider"></div>
    <div class="summary-row"><span>الإجمالي الفرعي</span><span class="price">115.00 ج.م</span></div>
    <div class="summary-row"><span>رسوم التوصيل</span><span class="price">7.50 ج.م</span></div>
    <div class="summary-row total"><span>الإجمالي</span><span class="price">122.50 ج.م</span></div>
    <button class="btn btn-outline btn-block mt-3"><i class="fa-regular fa-circle-question"></i> احصل على مساعدة بخصوص الطلب</button>
  </div>

</main>

<script src="assets/js/app.js"></script>
</body>
</html>
